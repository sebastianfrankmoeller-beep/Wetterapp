name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle wird direkt installiert, ein Gradle-Wrapper im Repo ist nicht nötig.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK bauen
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Fehler als Hinweise im Lauf anzeigen (Kompilierfehler direkt sichtbar)
      - name: Fehler zusammenfassen
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      # APK prüfen: Signatur und Paketdaten als Hinweise im Lauf anzeigen
      - name: APK prüfen
        shell: bash
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ls -la "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -20 | while IFS= read -r l; do echo "::notice::$l"; done
          "$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^package|sdkVersion|targetSdk|native-code|application-label:" | while IFS= read -r l; do echo "::notice::$l"; done
          unzip -l "$APK" | tail -1 | while IFS= read -r l; do echo "::notice::$l"; done

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Wetter-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
