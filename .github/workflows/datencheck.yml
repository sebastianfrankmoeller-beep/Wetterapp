name: Datencheck

# Rechnet die Auswertung der App mit festen Wetterlagen und echten Live-Daten durch.
# Unabhängig vom APK-Build: ein Fehler hier verhindert keine APK.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17 * * *"   # dreimal täglich mit dem aktuellen Wetter

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Datencheck
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --tests 'de.basti.wetter.DatenCheckTest' 2>&1 | tee test.log
      - name: Bericht
        if: always()
        shell: bash
        run: |
          if [ -f app/build/datencheck.md ]; then
            cat app/build/datencheck.md >> "$GITHUB_STEP_SUMMARY"
            # Je Ort ein Hinweis (lesbar über die API, ohne Log-Download)
            python3 - <<'PY'
          import re
          txt = open("app/build/datencheck.md", encoding="utf-8").read()
          parts = re.split(r"\n(?=## )", txt)
          for p in parts[1:10]:
              title = p.splitlines()[0].lstrip("# ").strip()
              msg = p.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Datencheck {title}::{msg}")
          PY
          fi
      - name: Testergebnisse
        if: always()
        shell: bash
        run: |
          grep -E "DatenCheckTest > .* (PASSED|FAILED|SKIPPED)" test.log | sed 's/^/::notice title=Test::/' | head -10 || true
      - name: Fehler
        if: always()
        shell: bash
        run: |
          grep -E "FAILED|AssertionError|expected:<|Widersprüche" -A3 test.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Datencheck-Bericht
          path: |
            app/build/datencheck.md
            app/build/reports/tests/
          if-no-files-found: ignore
